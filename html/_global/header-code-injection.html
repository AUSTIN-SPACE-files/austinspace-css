<!-- FAQ mobile collapse. The pairs ship as <details open> so a no-JS client or a
     script failure leaves every answer visible rather than every answer hidden.
     Below 860 this strips [open]; above it restores it, keeping the desktop
     editorial band identical to its pre-details rendering. No-ops on pages with
     no FAQ. matchMedia change fires only on crossing the breakpoint, so no
     resize debounce is needed. -->
<script>
  (function () {
    var mq = window.matchMedia('(max-width: 860px)');
    function sync() {
      var items = document.querySelectorAll('details.as-faq__pair');
      for (var i = 0; i < items.length; i++) {
        if (mq.matches) { items[i].removeAttribute('open'); }
        else { items[i].setAttribute('open', ''); }
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sync);
    } else { sync(); }
    if (mq.addEventListener) { mq.addEventListener('change', sync); }
    else if (mq.addListener) { mq.addListener(sync); }
  })();
</script>

<!-- Backstory read-more collapse. Same contract as the FAQ block above, and
     deliberately its OWN matchMedia rather than a parameter on that loop: this
     one is keyed to 600 and the FAQ to 860, so keeping them independent means
     changing one breakpoint cannot silently move the other. Ships as
     <details open> so a no-JS client or a script failure shows the whole
     backstory rather than a third of it. Resize behaviour mirrors the FAQ -
     matchMedia change fires only on crossing the breakpoint, so no resize
     debounce is needed. No-ops on pages with no backstory. -->
<script>
  (function () {
    var mq = window.matchMedia('(max-width: 600px)');
    function sync() {
      var items = document.querySelectorAll('details.as-bs-more');
      for (var i = 0; i < items.length; i++) {
        if (mq.matches) { items[i].removeAttribute('open'); }
        else { items[i].setAttribute('open', ''); }
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sync);
    } else { sync(); }
    if (mq.addEventListener) { mq.addEventListener('change', sync); }
    else if (mq.addListener) { mq.addListener(sync); }
  })();
</script>

<!-- Mobile card rail. Below 600 .as-rail turns a card grid into a full-bleed
     horizontal scroller; the CSS does all of that on its own. This script only
     toggles .as-rail-end, which slides the right-edge mask off once the scroll
     reaches the end. If it never runs the rail still scrolls and snaps and the
     fade simply stays visible, same degradation principle as the FAQ sync above.
     tabindex="0" is load bearing: the cards are plain divs with nothing
     focusable inside, so without it a keyboard user cannot scroll the rail at
     all. No-ops on pages with no rail. -->
<script>
  (function () {
    var mq = window.matchMedia('(max-width: 600px)');
    function wire() {
      var rails = document.querySelectorAll('.as-rail');
      for (var i = 0; i < rails.length; i++) {
        var r = rails[i];
        if (r.dataset.railWired) continue;
        r.dataset.railWired = '1';
        r.setAttribute('tabindex', '0');
        r.setAttribute('role', 'group');
        r.setAttribute('aria-label', 'Scrollable cards');
        (function (rail) {
          function upd() {
            var end = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 4;
            rail.classList.toggle('as-rail-end', end || !mq.matches);
          }
          rail.addEventListener('scroll', upd, { passive: true });
          if (mq.addEventListener) { mq.addEventListener('change', upd); }
          else if (mq.addListener) { mq.addListener(upd); }
          upd();
        })(r);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wire);
    } else { wire(); }
  })();
</script>

<!-- Rail position counter. Injects an "01 / 09" readout as a sibling directly
     after every .as-rail and keeps the current index in step with the scroll.
     Styled by .as-rail-counter in the stylesheet, which is display:none until
     this script adds .is-scrollable, so a script failure degrades to no counter
     rather than to a stuck "01 / 01". aria-hidden because the count duplicates
     what the rail already exposes to AT via its role/aria-label, set by the
     script above.

     SEPARATE IIFE FROM THE .as-rail-end SCRIPT ABOVE, DELIBERATELY. The two
     guard on different data attributes (railWired vs counterInit) and neither
     reads the other's state, so they can be reordered or either one removed
     without touching the other. Both no-op on pages with no rail.

     THE INDEX MATHS IS RECT-BASED ON PURPOSE - DO NOT "SIMPLIFY" IT BACK TO
     offsetLeft. getBoundingClientRect returns viewport coordinates, so the
     rail's midpoint and each card's centre are measured on the same axis and
     subtract cleanly. offsetLeft does not: it resolves against the nearest
     POSITIONED ancestor, and :root .as-rail sets no position (css:13071), so
     the cards would measure from some ancestor section while the rail's own
     midpoint came from scrollLeft in its padding box. That mismatch put a
     constant 0-32px skew on every comparison and could flip the readout one
     card early near a snap boundary. Rects need nothing from the CSS, which is
     why the rail rule and its mask were left alone rather than given a
     position: relative. Rect reads are also scroll-accurate for free, so no
     scrollLeft term is needed here at all. -->
<script>
  (function () {
    function pad(n){ return (n < 10 ? '0' : '') + n; }
    function initRail(rail){
      if (rail.dataset.counterInit) return;
      rail.dataset.counterInit = '1';
      var counter = document.createElement('div');
      counter.className = 'as-rail-counter';
      counter.setAttribute('aria-hidden', 'true');
      counter.innerHTML = '<b>01</b> / <span></span>';
      rail.insertAdjacentElement('afterend', counter);
      var curEl = counter.querySelector('b');
      var totalEl = counter.querySelector('span');
      function cards(){
        return Array.prototype.filter.call(rail.children, function (c) {
          return c.getClientRects().length;
        });
      }
      function update(){
        rail.classList.toggle('is-scrollable', rail.scrollWidth > rail.clientWidth + 4);
        var list = cards();
        totalEl.textContent = pad(list.length);
        var railRect = rail.getBoundingClientRect();
        var mid = railRect.left + railRect.width / 2, idx = 0, best = Infinity;
        for (var i = 0; i < list.length; i++) {
          var b = list[i].getBoundingClientRect();
          var center = b.left + b.width / 2;
          var d = Math.abs(center - mid);
          if (d < best) { best = d; idx = i; }
        }
        curEl.textContent = pad(idx + 1);
      }
      rail.addEventListener('scroll', function () { requestAnimationFrame(update); }, { passive: true });
      window.addEventListener('resize', update);
      update();
    }
    function init(){ Array.prototype.forEach.call(document.querySelectorAll('.as-rail'), initRail); }
    if (document.readyState !== 'loading') init();
    else document.addEventListener('DOMContentLoaded', init);
  })();
</script>

     WHY THIS IS IN THE HEADER INJECTION AND NOT THE FOOTER. Every
     .as-hero__img carries clip-path:url(#wave-clip-*). While these defs
     sat in the footer injection the clipPath they reference did not
     exist in the DOM until ~453 elements after the first hero img (DOM
     index 731 of 959 vs 278). A definition should parse before its
     first consumer - that is the whole reason, and it stands on its

     hero bands appearing blank for several seconds after load. THAT
     DEFECT WAS NOT REAL - it was an artefact of measuring in a hidden
     browser tab, which Chrome does not render at all. See the full
     correction in master-stylesheet.css above "Per-page clip and crop".
     The move was never credited as the fix and must not be described
     as one. It is kept purely because defs-before-consumer is correct
     ordering. If you are reading this while chasing a paint-timing
     problem, check document.visibilityState first.

     lands inside <head>. A <div> is not permitted there, so the HTML
     parser pops <head>, opens <body>, and reprocesses - which is

     they parse before any hero img on any page. Zero visual footprint.

     <head> where they belong. What CANNOT be controlled from here is
